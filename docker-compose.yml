services:

  app:
    build: .
    container_name: projeto-final-ebac
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - sqlite_data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=sqlite:////app/data/pokemons.db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: ["poetry", "run", "uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]

  db:
    image: alpine:3.20
    container_name: sqlite-container
    command: sh -c "apk add --no-cache sqlite && touch /data/pokemons.db && tail -f /dev/null"
    volumes:
      - sqlite_data:/data
    healthcheck:
      test: ["CMD", "sh", "-c", "command -v sqlite3 && test -f /data/pokemons.db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: redis-container
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  sqlite_data:
  redis_data:
    