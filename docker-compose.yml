services:

  app:
    build: .
    container_name: projeto-final-Ebac
    ports:
      - "8080:8080"
    volumes:
      - .:/app
    environment:
      - ENV_VAR=example_value
    volumes:
      - ./app:/app
    command: ["poetry", "run", "uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]

  redis:
    image: redis:7-alpine
    container_name: redis-container
    ports:
      - "6379:6379"
    