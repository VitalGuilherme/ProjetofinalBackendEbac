[project]
name = "pokeapiprojetofinal"
version = "0.1.0"
description = ""
authors = [
    {name = "Guilherme Vital",email = "guilhermev.j.santos@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard] (>=0.162.0,<0.163.0)",
    "sqlalchemy (>=2.1.6,<3.0.0)",
    "aiosqlite (>=0.22.1,<0.23.0)",
    "redis (>=8.1.0,<9.0.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "requests (>=2.34.2,<3.0.0)",
    "fakeredis (>=2.40.0,<3.0.0)"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
